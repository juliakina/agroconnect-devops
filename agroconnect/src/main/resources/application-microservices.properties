app.ai.transport=remote
app.ai.internal-key=${AI_INTERNAL_KEY:}
spring.ai.model.chat=none
eureka.client.enabled=true
spring.cloud.discovery.enabled=true
spring.cloud.service-registry.auto-registration.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://agroconnect:${EUREKA_PASSWORD:}@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
spring.cloud.openfeign.client.config.agroconnect-ia.connectTimeout=5000
spring.cloud.openfeign.client.config.agroconnect-ia.readTimeout=60000
spring.cloud.openfeign.client.config.recommendationAi.connectTimeout=5000
spring.cloud.openfeign.client.config.recommendationAi.readTimeout=60000
