spring.application.name=agroconnect
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:agroconnect
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:db/migration
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
jwt.key=${Jwt__Key:${JWT_KEY:}}
jwt.issuer=${Jwt__Issuer:${JWT_ISSUER:AgroConnect}}
jwt.audience=${Jwt__Audience:${JWT_AUDIENCE:AgroConnect.Mobile}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=6000
spring.ai.openai.timeout=45s
spring.ai.openai.max-retries=0
app.ai.cache-minutes=30
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.user-email=${DEMO_USER_EMAIL:}
app.bootstrap.user-password=${DEMO_USER_PASSWORD:}
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.urls[0].name=AgroConnect v1
springdoc.swagger-ui.urls[0].url=/v3/api-docs/agroconnect-v1
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.override-with-generic-response=false
