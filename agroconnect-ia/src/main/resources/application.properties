spring.application.name=agroconnect-ia
server.port=${PORT:8082}
server.address=0.0.0.0
eureka.client.service-url.defaultZone=${EUREKA_URL:http://agroconnect:${EUREKA_PASSWORD:}@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=6000
spring.ai.openai.timeout=45s
spring.ai.openai.max-retries=0
app.ai.internal-key=${AI_INTERNAL_KEY:}
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
management.endpoint.health.show-details=never
